name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Le fichier unique est servi comme page d'accueil (HANDOFF §9.1).
      - run: mkdir site && cp dist/carnet-l5r.html site/index.html
      # Manifeste, service worker, sitemap et image de partage, sur l'adresse Pages seulement (annexes O.3 et P).
      - run: node scripts/pages-pwa.mjs
      # Présentation lisible sans JavaScript, sur l'adresse Pages seulement (annexe P).
      - run: node scripts/pages-seo.mjs
      # Compteur de visites, sur l'adresse Pages seulement (annexe O.5).
      - run: node scripts/pages-compteur.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
