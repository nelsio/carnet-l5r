name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tous les tags, pour savoir si celui-ci est la plus haute version.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Le tag doit correspondre à la version de package.json (affichée en pied de page).
      - name: Vérifier la version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à package.json ($version)"
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # « Latest » seulement pour la plus haute version : un tag ancien posé en retard ne la remplace pas.
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plus_haut="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          if [ "$plus_haut" = "$GITHUB_REF_NAME" ]; then latest=true; else latest=false; fi
          gh release create "$GITHUB_REF_NAME" dist/carnet-l5r.html --title "Carnet de Rokugan $GITHUB_REF_NAME" --generate-notes --latest="$latest"
