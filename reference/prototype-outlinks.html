<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet : liens Portail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Prototype : liens du Carnet de Rokugan vers le portail de campagne.
   Jetons repris de HANDOFF-colors.md (annexe I.1). Mobile simulé en @container (appli : @media max-width:720px). */
:root{
  --p-bg:#f4f2ee;--p-ink:#222;--p-muted:#5f5d58;--p-line:#d6d2ca;--p-chip:#fff;--p-on:#222;--p-on-ink:#fff;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p-bg:#161718;--p-ink:#e6e4df;--p-muted:#a9a7a2;--p-line:#3a3c40;--p-chip:#222427;--p-on:#e6e4df;--p-on-ink:#161718;color-scheme:dark}}
:root[data-theme="dark"]{--p-bg:#161718;--p-ink:#e6e4df;--p-muted:#a9a7a2;--p-line:#3a3c40;--p-chip:#222427;--p-on:#e6e4df;--p-on-ink:#161718;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--p-bg);color:var(--p-ink);font:14px/1.5 var(--f-body);padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h1.p{font:800 22px/1.2 var(--f-display);margin:0 0 4px;text-wrap:balance}
.lede{color:var(--p-muted);margin:0 0 18px;max-width:70ch}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;margin-bottom:14px}
.ctl{display:grid;gap:6px}
.ctl>span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--p-muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--p-line);background:var(--p-chip);color:var(--p-ink);border-radius:999px;padding:6px 12px;font:inherit;font-weight:500;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--p-on);color:var(--p-on-ink);border-color:var(--p-on)}
.legend{border:1px solid var(--p-line);border-radius:10px;padding:12px 14px;margin-bottom:16px;color:var(--p-ink);max-width:80ch}
.legend b{font-weight:700}
.legend .k{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--p-on);color:var(--p-on-ink);font:700 11px/1 var(--f-body);margin-right:6px;vertical-align:1px}
.stage{overflow-x:auto;padding-bottom:4px}
.frame{margin:0 auto;border:1px solid var(--p-line);border-radius:10px;overflow:hidden}
.frame.desk{width:1080px}
.frame.mob{width:390px}

/* ---- Appli (jetons du Carnet) ---- */
.app{
  --clan-l:#3d5a73;--clan-ink-l:#374754;--clan-d:#8fb0cc;--clan-ink-d:#a1bbd0;
  --bg:#ece6d8;--surface:#f7f3ea;--surface-2:#fdfbf6;--ink:#2a261f;
  --muted:color-mix(in oklab,var(--ink) 70%,var(--surface));
  --line:color-mix(in oklab,var(--ink) 18%,transparent);
  --shadow:0 10px 28px rgb(60 45 20 / .18);--scrim:rgb(0 0 0 / .35);
  --accent:var(--clan-l);--accent-ink:var(--clan-ink-l);
  --accent-pale:color-mix(in oklab,var(--accent) 16%,var(--surface));
  --on-accent:#ffffff;--warn:#8a5800;
  --seal:#a8382a;--seal-ink:#f7f3ea;
  color-scheme:light;
  container-type:inline-size;position:relative;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);min-height:640px
}
.app[data-theme="dark"]{
  --bg:#26252a;--surface:#302f33;--surface-2:#3a393e;--ink:#e7e5e0;
  --shadow:0 10px 28px rgb(0 0 0 / .45);--scrim:rgb(0 0 0 / .55);
  --accent:var(--clan-d);--accent-ink:var(--clan-ink-d);--on-accent:var(--bg);--warn:#e6bf55;
  --seal:#b5402f;--seal-ink:#f3ece0;color-scheme:dark
}
.app .body{padding:0 24px 28px}
.app h1,.app h2,.app h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
.app button{font:inherit;color:inherit}
.app a{color:var(--accent-ink)}
.app :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ext{width:13px;height:13px;flex:none;vertical-align:-1px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 14px;border-bottom:3px solid var(--accent)}
.who{display:flex;align-items:center;gap:16px;min-width:0}
.who-txt{min-width:0}
.who h1{font-size:clamp(26px,5vw,38px);font-weight:800}
.who .sub{color:var(--muted);margin-top:2px}
.seal{flex:none;display:grid;place-items:center;width:64px;height:64px;border:0;border-radius:8px;background:var(--seal);color:var(--seal-ink);font:800 38px/1 var(--f-display);rotate:-3deg;box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px var(--seal-ink)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-bottom:4px}
.brand{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow .sep{width:1px;height:12px;background:var(--line)}
.mon{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);text-decoration:none;border-radius:4px}
.mon::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
a.mon:hover{text-decoration:underline;text-underline-offset:3px}
.top-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:relative}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 10px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;min-height:36px}
.hbtn .ico{width:16px;height:16px;flex:none}
.hbtn[aria-expanded="true"]{background:var(--accent-pale);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:2px;background:color-mix(in oklab,var(--ink) 8%,var(--bg));padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Menu Ressources (A) */
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:6;width:340px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px}
.menu h3{font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 10px 6px}
.menu a{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink);min-height:44px}
.menu a:hover{background:var(--accent-pale)}
.menu .kj{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font:800 15px/1 var(--f-display);color:var(--accent-ink)}
.menu .t{font-weight:700;font-size:14px;line-height:1.25}
.menu .d{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.menu .ext{color:var(--muted)}
.menu .foot{border-top:1px solid var(--line);margin-top:6px;padding:8px 10px 4px;font-size:12px;color:var(--muted)}
.scrim{display:none}

/* Bibliothèque vide (B) */
.empty{margin-top:22px;display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.card h2{font-size:21px;font-weight:800;margin-bottom:6px}
.card p{margin:0;color:var(--muted)}
.steps{list-style:none;margin:16px 0 18px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.steps li{display:grid;gap:4px;align-content:start;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.steps .n{font:800 18px/1 var(--f-display);color:var(--accent-ink)}
.steps .s{font-weight:700;font-size:14px}
.steps .x{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.app a.btn.pri{color:var(--on-accent)}
.app a.btn{color:var(--ink)}
.app a.btn.pri .ext{color:var(--on-accent)}
.alt{display:grid;gap:10px;align-content:start}
.alt .btn{justify-content:flex-start}

.start{margin-top:22px;padding:22px}
.start-head p{margin:2px 0 0;color:var(--muted)}
.lnk{border:0;background:none;padding:0;font-weight:700;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.opt{display:grid;grid-template-rows:auto 1fr auto;gap:0;border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--bg)}
.opt .steps{margin:14px 0 16px}
.opt .steps li{background:var(--surface)}
.opt .btn{justify-self:start}
.opt-h{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.opt-h h3{font-size:18px;font-weight:800}
.opt-h p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.opt-k{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;background:var(--accent-pale);color:var(--accent-ink);font:800 20px/1 var(--f-display)}
.tpl{margin-top:22px}
.tpl-head h2{font-size:20px;font-weight:800}
.tpl-head p{margin:2px 0 12px;color:var(--muted)}
.tpl-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tplc{display:grid;grid-template-columns:40px 1fr;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tplc .row{grid-column:1 / -1}
.tplt .ty{font:700 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.tplt .n{font-weight:700;font-size:15px}
.tplt .m{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot.sm{width:9px;height:9px;flex:none}
.newchar{margin-top:16px;padding:18px}
.newchar h2{font-size:19px;font-weight:800;margin-bottom:12px}
.nc-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nc-opt{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.nc-opt h3{font-size:16px;font-weight:800;margin:0}
.nc-opt p{margin:0;font-size:13px;color:var(--muted)}
.nc-opt .btn{grid-column:2;justify-self:start;margin-top:8px}
.nc-foot{margin:12px 0 0;font-size:13px;color:var(--muted)}
.btn.sm{padding:6px 12px;min-height:40px;font-size:13px}
.btn.ghost{background:transparent}
.tpl + .note{margin-top:16px}

/* Bibliothèque avec fiches (C) */
.libhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 12px}
.libhead h2{font-size:22px;font-weight:800}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.dot{width:14px;height:14px;border-radius:50%}
.item .n{font-weight:700}
.item .m{font-size:13px;color:var(--muted)}
.forge-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:14px;padding:12px 16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px}
.forge-line a{display:inline-flex;align-items:center;gap:5px;font-weight:700;text-underline-offset:3px}

/* Fiche (D) */
.sheet{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card h3{font-size:18px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h3 a{font:700 13px/1 var(--f-body);display:inline-flex;align-items:center;gap:5px;text-underline-offset:3px}
.spells{display:grid;gap:8px}
.spell{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.el{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font:800 13px/1 var(--f-display)}
.spell .n{font-weight:700;font-size:14px}
.spell .m{font-size:12px;color:var(--muted)}
.gr{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;color:var(--accent-ink)}
.gr:hover{background:var(--accent-pale)}
.gr svg{width:18px;height:18px}
.tech{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tech li{padding:8px 10px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 6px 6px 0}
.tech .n{font-weight:700;font-size:14px}
.tech .m{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* Aide de jeu (E) */
.sit{display:flex;gap:4px;margin:20px 0 14px;flex-wrap:wrap}
.sit button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;color:var(--muted);cursor:pointer;min-height:40px}
.sit button[aria-pressed="true"]{background:var(--accent-pale);border-color:var(--accent);color:var(--accent-ink)}
.aide{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.ph{border:1px dashed var(--line);border-radius:10px;padding:28px;color:var(--muted);text-align:center}
.more{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 14px}
.more h3{font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.more a{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;min-height:44px}
.more a:first-of-type{border-top:0}
.more .t{font-weight:700;color:var(--accent-ink);font-size:14px}
.more .d{display:block;font-size:12px;color:var(--muted)}
.more .ext{color:var(--muted)}

.mtabs{display:none}

/* ---- Mobile ---- */
@container (max-width:720px){
  .app .body{padding:0 16px 96px}
  header.top{padding-block:14px 10px}
  .who{gap:12px}
  .who h1{font-size:26px;overflow-wrap:anywhere}
  .seal{width:52px;height:52px;border-radius:7px;font-size:30px}
  .brand{font-size:10px;letter-spacing:.12em}
  .mon{font-size:10px;letter-spacing:.08em}
  .mon::before{width:9px;height:9px}
  .top-right{width:100%;position:static}
  .hbtn{position:relative;width:40px;height:40px;padding:0;justify-content:center;border-radius:50%;min-height:0}
  .hbtn .txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .hbtn .ico{width:20px;height:20px}
  .top-right .tabs{display:none}
  .mtabs{display:grid;position:absolute;left:0;right:0;bottom:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px;z-index:4}
  .mtabs button{border:0;background:transparent;padding:12px 4px;border-radius:8px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
  .mtabs button[aria-pressed="true"]{background:var(--accent-pale);color:var(--accent-ink)}
  .scrim{display:block;position:absolute;inset:0;background:var(--scrim);z-index:5}
  .menu{position:absolute;left:0;right:0;top:auto;bottom:0;width:auto;border-radius:14px 14px 0 0;max-height:88%;overflow:auto;padding:6px 8px 16px}
  .menu::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 2px}
  .empty,.sheet,.aide,.opts,.tpl-list,.nc-opts{grid-template-columns:1fr}
  .start{padding:16px}
  .steps{grid-template-columns:1fr}
  .steps li{grid-template-columns:24px 1fr;column-gap:10px}
  .steps .n{grid-row:span 2}
  .item{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <h1 class="p">Carnet de Rokugan : liens vers le portail de campagne</h1>
  <p class="lede">Prototype de référence. Tous les liens ouvrent le site de la campagne dans un nouvel onglet ; le Carnet ne fait toujours aucun appel réseau.</p>

  <div class="controls">
    <div class="ctl"><span>Écran</span><div class="seg" data-ctl="screen">
      <button type="button" data-v="empty" aria-pressed="false">Bibliothèque vide</button>
      <button type="button" data-v="lib" aria-pressed="false">Bibliothèque</button>
      <button type="button" data-v="sheet" aria-pressed="true">Fiche</button>
      <button type="button" data-v="aide" aria-pressed="false">Aide de jeu</button>
    </div></div>
    <div class="ctl"><span>Personnage</span><div class="seg" data-ctl="char">
      <button type="button" data-v="okado" aria-pressed="true">Okado Hiruma (Crabe)</button>
      <button type="button" data-v="isawa" aria-pressed="false">Shugenja Phénix</button>
    </div></div>
    <div class="ctl"><span>Thème</span><div class="seg" data-ctl="theme">
      <button type="button" data-v="light" aria-pressed="true">Clair</button>
      <button type="button" data-v="dark" aria-pressed="false">Sombre</button>
    </div></div>
    <div class="ctl"><span>Largeur</span><div class="seg" data-ctl="width">
      <button type="button" data-v="desk" aria-pressed="true">Bureau 1080</button>
      <button type="button" data-v="mob" aria-pressed="false">Mobile 390</button>
    </div></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="stage">
    <div class="frame desk" id="frame">
      <div class="app" id="app" data-theme="light"></div>
    </div>
  </div>
</div>

<script>
const BASE = "https://vincenzorpg.github.io/L5R/";
const URL_ = {
  portail: BASE + "index.html",
  forge: BASE + "createcharacter.html",
  grimoire: BASE + "grimoire.html",
  combat: BASE + "aides/combat-memento.html",
  bushido: BASE + "aides/bushido-honneur.html",
  etiquette: BASE + "aides/etiquette-coutumes.html",
  clan: slug => BASE + "clans/" + slug + ".html",
  sort: name => BASE + "grimoire.html?q=" + encodeURIComponent(name)
};
const CHARS = {
  okado: { name:"Okado Hiruma", school:"École de bushi Hiruma", rank:3,
    clan:{label:"Clan du Crabe", slug:"crabe", kj:"土", l:"#3d5a73", il:"#374754", d:"#8fb0cc", id:"#a1bbd0"},
    techs:[["Rang 1","Technique d'école de rang 1"],["Rang 2","Technique d'école de rang 2"],["Rang 3","Technique d'école de rang 3"]], spells:null },
  isawa: { name:"Isawa Tomoe", school:"École de shugenja Isawa", rank:2,
    clan:{label:"Clan du Phénix", slug:"phenix", kj:"鳳", l:"#c25a14", il:"#8a4921", d:"#f0a066", id:"#f0ae80"},
    techs:[["Rang 1","Technique d'école de rang 1"],["Rang 2","Technique d'école de rang 2"]],
    spells:[["空","Sentir","Universel · Maîtrise 1","#6b5b8a"],["空","Communier","Universel · Maîtrise 1","#6b5b8a"],["火","Invoquer","Universel · Maîtrise 1","#b5402f"]] }
};
const SIT = {
  combat: { label:"Combat", links:[["combat","Mémento de combat","Round d'escarmouche, postures, duel Iaijutsu"]] },
  cour: { label:"Cour", links:[["etiquette","Étiquette & coutumes","Castes, cadeaux, cérémonie du thé"],["bushido","Bushido & honneur","Vertus, gains et pertes d'honneur"]] },
  escarm: { label:"Escarmouche", links:[["combat","Mémento de combat","Postures et manœuvres"]] },
  voyage: { label:"Voyage", links:[["etiquette","Étiquette & coutumes","Protocole des sabres, sauver la face"]] }
};
const LEGEND = {
  empty:`<b><span class="k">B</span>Accueil sans fiche.</b> Deux options au même niveau, Forger sur le portail ou Fiche vierge, chacune avec ses trois étapes. Les modèles de personnage sont visibles dessous, chacun avec nom, clan et Rang ; « Importer un JSON » reste accessible en tête.`,
  lib:`<b><span class="k">C</span>Bibliothèque avec fiches.</b> Sous la liste, le bloc « Un nouveau personnage ? » présente les deux options (Forge ou fiche vierge) et les modèles. Le bouton « Nouvelle fiche » de l'en-tête de liste y est déplacé. Ouvre aussi le menu <b>Ressources</b> <span class="k">A</span> dans l'en-tête.`,
  sheet:`<b><span class="k">D</span>Fiche.</b> Le nom du clan devient un lien vers sa page. Sorts : un lien par sort vers le grimoire, adresse <code>grimoire.html?q=nom</code>. Menu <b>Ressources</b> <span class="k">A</span> dans l'en-tête.`,
  aide:`<b><span class="k">E</span>Aide de jeu.</b> Encadré compact de liens vers le portail, qui change avec la situation : Combat → Mémento, Cour → Étiquette et Bushido.`
};
const state = { screen:"sheet", char:"okado", theme:"light", width:"desk", menu:false, sit:"combat" };
const ICO = {
  ext:'<svg class="ext" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3H3.5A.5.5 0 0 0 3 3.5v9a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V10M9 3h4v4M13 3 7.5 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  torii:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5c3 .8 15 .8 18 0M5 9.5h14M7.5 6.3V20M16.5 6.3V20M12 6.6v2.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  books:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15.2 4.6l2.8-.7 3 15.5-2.8.7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  dice:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/></svg>',
  theme:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>'
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ext = (href, inner, cls="", label="") => `<a href="${href}" target="_blank" rel="noopener"${cls?` class="${cls}"`:""}${label?` aria-label="${esc(label)}"`:""}>${inner}</a>`;
const hbtn = (ico, label, extra="") => `<button type="button" class="hbtn" title="${label}" ${extra}>${ICO[ico]}<span class="txt">${label}</span></button>`;

function menuHTML(c){
  const item = (href, kj, t, d) => ext(href, `<span class="kj" aria-hidden="true">${kj}</span><span class="t">${t}<span class="d">${d}</span></span>${ICO.ext}`);
  return `<div class="scrim" data-act="close"></div>
  <div class="menu" id="menu" role="menu" aria-label="Ressources de la campagne">
    <h3>Campagne</h3>
    ${item(URL_.portail,"帝","Portail de la campagne","Clans, règles, aides de jeu")}
    ${c ? item(URL_.clan(c.clan.slug), c.clan.kj, c.clan.label, "Histoire, familles et serments") : ""}
    <h3>Créer</h3>
    ${item(URL_.forge,"鍛","Forge de personnage","Exporte un JSON compatible avec le Carnet")}
    <h3>Références</h3>
    ${item(URL_.grimoire,"巻","Grimoire","Sorts, Kihō, recherche par effet")}
    ${item(URL_.combat,"刀","Mémento de combat","Postures, duel Iaijutsu")}
    ${item(URL_.bushido,"義","Bushido & honneur","Vertus et barème d'honneur")}
    ${item(URL_.etiquette,"茶","Étiquette & coutumes","Castes, cadeaux, thé")}
    <div class="foot">Site de la campagne. S'ouvre dans un nouvel onglet.</div>
  </div>`;
}

function headerHTML(c){
  const res = hbtn("torii","Ressources",`aria-haspopup="menu" aria-expanded="${state.menu}" data-act="menu"`);
  const right = hbtn("books","Bibliothèque") + hbtn("dice","Lanceur de dés : masqué") + hbtn("theme",`Thème : ${state.theme==="dark"?"sombre":"clair"}`) + res;
  const tabs = c ? `<div class="tabs" role="group" aria-label="Vue"><button type="button" data-tab="sheet" aria-pressed="${state.screen==="sheet"}">Fiche</button><button type="button" data-tab="aide" aria-pressed="${state.screen==="aide"}">Aide de jeu</button><button type="button" aria-pressed="false">Statistiques</button></div>` : "";
  const who = c
    ? `<span class="seal" aria-hidden="true">帳</span><div class="who-txt"><div class="eyebrow"><span class="brand">Carnet de Rokugan</span><span class="sep" aria-hidden="true"></span>${ext(URL_.clan(c.clan.slug), esc(c.clan.label)+" "+ICO.ext, "mon", c.clan.label+" : page du clan sur le portail (nouvel onglet)")}</div><h1>${esc(c.name)}</h1><div class="sub">${esc(c.school)} · Rang ${c.rank}</div></div>`
    : `<span class="seal" aria-hidden="true">帳</span><div class="who-txt"><h1>Carnet de Rokugan</h1><div class="sub">Compagnon de campagne · L5R 4e</div></div>`;
  return `<header class="top"><div class="who">${who}</div><div class="top-right">${right}${tabs}</div></header>`;
}

function bodyHTML(c){
  if (state.screen === "empty") return `
    <section class="card start">
      <div class="start-head">
        <h2>Pas encore de personnage ?</h2>
        <p>Deux façons de commencer. Tu as déjà un fichier ? <button type="button" class="lnk">Importer un JSON</button></p>
      </div>
      <div class="opts">
        <article class="opt">
          <div class="opt-h"><span class="opt-k" aria-hidden="true">鍛</span><div><h3>Forger sur le portail</h3><p>Création guidée : le portail calcule l'XP, les traits et les bonus d'école.</p></div></div>
          <ol class="steps">
            <li><span class="n">一</span><span class="s">Forger</span><span class="x">Clan, école, anneaux, compétences</span></li>
            <li><span class="n">二</span><span class="s">Exporter</span><span class="x">Bouton « JSON » de la Forge</span></li>
            <li><span class="n">三</span><span class="s">Importer</span><span class="x">Ici, avec « Importer un JSON »</span></li>
          </ol>
          ${ext(URL_.forge, "Ouvrir la Forge "+ICO.ext, "btn pri")}
        </article>
        <article class="opt">
          <div class="opt-h"><span class="opt-k" aria-hidden="true">筆</span><div><h3>Fiche vierge</h3><p>Saisie directe dans le Carnet, pour recopier une fiche papier existante.</p></div></div>
          <ol class="steps">
            <li><span class="n">一</span><span class="s">Créer</span><span class="x">Nom, clan, école et Rang</span></li>
            <li><span class="n">二</span><span class="s">Remplir</span><span class="x">Anneaux, compétences, techniques</span></li>
            <li><span class="n">三</span><span class="s">Jouer</span><span class="x">Enregistrée dans ce navigateur</span></li>
          </ol>
          <button type="button" class="btn pri">Nouvelle fiche vierge</button>
        </article>
      </div>
    </section>
    <section class="tpl">
      <div class="tpl-head"><h2>Modèles de personnage</h2><p>Une fiche d'exemple complète, à ouvrir ou à copier pour partir d'une base.</p></div>
      <div class="tpl-list">
        ${[["刀","Bushi","Kakita Haruto","Clan de la Grue",1,"#2f7fb5","#8cc4ea"],["火","Shugenja","Tamori Ayane","Clan du Dragon",1,"#2f7a45","#7fcb93"],["扇","Courtisan","Doji Sayuri","Clan de la Grue",1,"#2f7fb5","#8cc4ea"]].map(([k,t,n,cl,r,l,d])=>`<article class="tplc"><span class="opt-k" aria-hidden="true">${k}</span><div class="tplt"><div class="ty">${t}</div><div class="n">${n}</div><div class="m"><span class="dot sm" style="background:${state.theme==="dark"?d:l}"></span>${cl} · Rang ${r}</div></div><div class="row"><button type="button" class="btn sm">Utiliser</button><button type="button" class="btn sm ghost">JSON</button></div></article>`).join("")}
      </div>
    </section>
    <p class="note">Nouveau à Rokugan ? ${ext(URL_.portail,"Découvrir la campagne "+ICO.ext)}</p>`;
  if (state.screen === "lib") return `
    <div class="libhead"><h2>Bibliothèque</h2><div class="row"><button type="button" class="btn">Importer un JSON</button></div></div>
    <div class="list">
      <div class="item"><span class="dot" style="background:${state.theme==="dark"?"#8fb0cc":"#3d5a73"}"></span><div><div class="n">Okado Hiruma</div><div class="m">Clan du Crabe · École de bushi Hiruma · modifiée aujourd'hui</div></div><button type="button" class="btn">Ouvrir</button></div>
      <div class="item"><span class="dot" style="background:${state.theme==="dark"?"#f0a066":"#c25a14"}"></span><div><div class="n">Isawa Tomoe</div><div class="m">Clan du Phénix · École de shugenja Isawa · Consultation</div></div><button type="button" class="btn">Ouvrir</button></div>
    </div>
    <section class="card newchar">
      <h2>Un nouveau personnage ?</h2>
      <div class="nc-opts">
        <div class="nc-opt"><span class="opt-k" aria-hidden="true">鍛</span><div><h3>Forger sur le portail</h3><p>Création guidée, puis export JSON à importer ici.</p></div>${ext(URL_.forge, "Ouvrir la Forge "+ICO.ext, "btn pri")}</div>
        <div class="nc-opt"><span class="opt-k" aria-hidden="true">筆</span><div><h3>Fiche vierge</h3><p>Saisie directe dans le Carnet, depuis une fiche papier.</p></div><button type="button" class="btn pri">Nouvelle fiche</button></div>
      </div>
      <p class="nc-foot">Ou partir d'un modèle : <button type="button" class="lnk">Bushi</button> · <button type="button" class="lnk">Shugenja</button> · <button type="button" class="lnk">Courtisan</button></p>
    </section>`;
  if (state.screen === "sheet") {
    const spells = c.spells ? `<section class="card">
        <h3>Sorts ${ext(URL_.grimoire,"Grimoire "+ICO.ext)}</h3>
        <div class="spells">${c.spells.map(([k,n,m,col]) => `<div class="spell"><span class="el" style="background:${col}" aria-hidden="true">${k}</span><div><div class="n">${n}</div><div class="m">${m}</div></div>${ext(URL_.sort(n), '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3H3.5A.5.5 0 0 0 3 3.5v9a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V10M9 3h4v4M13 3 7.5 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>', "gr", n+" dans le grimoire (nouvel onglet)")}</div>`).join("")}</div>
        <p class="note">Chaque lien ouvre le grimoire avec le nom du sort en recherche.</p>
      </section>` : `<section class="card"><h3>Sorts</h3><p class="note" style="margin:0">Aucun sort : la carte n'apparaît pas pour un bushi.</p></section>`;
    return `<div class="sheet">
      <section class="card"><h3>Techniques d'école</h3><ul class="tech">${c.techs.map(([r,t])=>`<li><div class="n">${r}</div><div class="m">${t}</div></li>`).join("")}</ul></section>
      ${spells}
    </div>`;
  }
  const s = SIT[state.sit];
  return `<div class="sit" role="group" aria-label="Situation">${Object.entries(SIT).map(([k,v])=>`<button type="button" data-sit="${k}" aria-pressed="${state.sit===k}">${v.label}</button>`).join("")}</div>
    <div class="aide">
      <div class="ph">Actions de la situation « ${s.label} » (inchangé)</div>
      <aside class="more" aria-label="Liens vers le portail">${s.links.map(([k,t,d])=>ext(URL_[k], `<span><span class="t">${t}</span><span class="d">${d}</span></span>${ICO.ext}`)).join("")}</aside>
    </div>`;
}

function render(){
  const app = document.getElementById("app");
  const noChar = state.screen === "empty" || state.screen === "lib";
  const c = noChar ? null : CHARS[state.char];
  app.dataset.theme = state.theme;
  document.getElementById("frame").className = "frame " + state.width;
  const cl = (c || CHARS.okado).clan;
  if (noChar){ app.style.setProperty("--clan-l","#7a6a3a");app.style.setProperty("--clan-ink-l","#5c5131");app.style.setProperty("--clan-d","#cdb67a");app.style.setProperty("--clan-ink-d","#d2bf8f"); }
  else { app.style.setProperty("--clan-l",cl.l);app.style.setProperty("--clan-ink-l",cl.il);app.style.setProperty("--clan-d",cl.d);app.style.setProperty("--clan-ink-d",cl.id); }
  const mtabs = c ? `<nav class="mtabs" aria-label="Vue"><button type="button" data-tab="sheet" aria-pressed="${state.screen==="sheet"}">Fiche</button><button type="button" data-tab="aide" aria-pressed="${state.screen==="aide"}">Aide de jeu</button><button type="button" aria-pressed="false">Stats</button></nav>` : "";
  app.innerHTML = `<div class="body">${headerHTML(c)}${bodyHTML(c)}</div>${mtabs}${state.menu ? menuHTML(c) : ""}`;
  if (state.menu && state.width === "desk") {
    const m = app.querySelector(".menu"), tr = app.querySelector(".top-right");
    tr.appendChild(m); app.querySelector(".scrim")?.remove();
  }
  document.getElementById("legend").innerHTML = LEGEND[state.screen];
  document.querySelectorAll('.seg[data-ctl="screen"] button').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.screen));
}

document.addEventListener("click", e => {
  const b = e.target.closest(".seg button");
  if (b){ state[b.parentElement.dataset.ctl] = b.dataset.v; state.menu = false;
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); return; }
  if (e.target.closest('[data-act="menu"]')){ state.menu = !state.menu; render(); if (state.menu) document.querySelector(".menu a")?.focus(); return; }
  if (e.target.closest('[data-act="close"]')){ state.menu = false; render(); return; }
  const t = e.target.closest("[data-tab]");
  if (t){ state.screen = t.dataset.tab; state.menu = false; render(); return; }
  const s = e.target.closest("[data-sit]");
  if (s){ state.sit = s.dataset.sit; render(); return; }
  if (state.menu && !e.target.closest(".menu")){ state.menu = false; render(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.menu){ state.menu = false; render(); document.querySelector('[data-act="menu"]')?.focus(); } });
render();
</script>

</html>
